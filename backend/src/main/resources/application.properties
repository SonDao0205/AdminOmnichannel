spring.application.name=admin
server.port=${PORT:8080}

# PostgreSQL connection. Management Backend is the single Flyway owner.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnichannel_pos}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Flyway configuration
spring.flyway.enabled=false

# Repositories use JdbcTemplate. Management Backend owns Flyway migrations.

## Do not leak exception details to API clients.
#server.error.include-message=never
#server.error.include-stacktrace=never
#server.error.include-binding-errors=never

# Platform-owner opaque session security.
app.admin.security.session-ttl=8h
app.admin.security.cookie-name=omni_admin_session
app.admin.security.cookie-secure=false
app.admin.security.cookie-same-site=Strict
app.admin.security.max-failed-logins=5
app.admin.security.lock-duration=15m
app.admin.security.login-rate-limit=20
app.admin.security.login-rate-window=5m
app.admin.security.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Local platform-owner bootstrap.
# Start once with enabled=true, then change enabled=false.
# Change this local password before the first successful startup.
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.display-name=${APP_ADMIN_BOOTSTRAP_DISPLAY_NAME:Platform Owner}
app.admin.bootstrap.rotate-password=${APP_ADMIN_BOOTSTRAP_ROTATE_PASSWORD:false}

# API documentation.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Expose health only.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SMTP used to deliver the first tenant password. Configure these values in the
# environment for Gmail, Outlook, SES, Mailgun, or another SMTP provider.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:2587}
spring.mail.username=${MAIL_USERNAME:daotruongsonyb0205@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

app.admin.mail.from=${ADMIN_MAIL_FROM:}
app.admin.mail.login-url=${TENANT_LOGIN_URL:http://localhost:5173/login}
