spring.application.name=admin
server.port=8080

# Local MySQL configuration.
# Replace CHANGE_ME_MYSQL_PASSWORD with the password accepted by:
# mysql -h 127.0.0.1 -P 3306 -u root -p
spring.datasource.url=jdbc:mysql://localhost:3306/omnichannel_pos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Repositories use JdbcTemplate. Flyway is the only schema owner.

## Do not leak exception details to API clients.
#server.error.include-message=never
#server.error.include-stacktrace=never
#server.error.include-binding-errors=never

# Platform-owner opaque session security.
app.admin.security.session-ttl=8h
app.admin.security.cookie-name=omni_admin_session
app.admin.security.cookie-secure=false
app.admin.security.cookie-same-site=Strict
app.admin.security.max-failed-logins=5
app.admin.security.lock-duration=15m
app.admin.security.login-rate-limit=20
app.admin.security.login-rate-window=5m
app.admin.security.allowed-origins=http://localhost:5173

# Local platform-owner bootstrap.
# Start once with enabled=true, then change enabled=false.
# Change this local password before the first successful startup.
app.admin.bootstrap.enabled=false
app.admin.bootstrap.email=admin@omnichannel.local
app.admin.bootstrap.password=02052006Son@@
app.admin.bootstrap.display-name=Platform Owner
app.admin.bootstrap.rotate-password=true

# API documentation.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Expose health only.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
