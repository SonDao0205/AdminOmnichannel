# Production must terminate HTTPS either here or at a trusted reverse proxy.
app.admin.security.cookie-secure=true

# Do not publish interactive API documentation in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never

app.admin.security.allowed-origin-patterns=${ADMIN_ALLOWED_ORIGIN_PATTERNS}
app.admin.mail.login-url=${TENANT_LOGIN_URL}
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never