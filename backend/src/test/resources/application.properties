spring.datasource.url=jdbc:h2:mem:admin_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql
app.admin.bootstrap.enabled=false
app.admin.security.cookie-secure=false
spring.mail.host=localhost
spring.mail.port=1025
app.admin.mail.from=no-reply@test.local
app.admin.mail.login-url=http://localhost:5173/login
